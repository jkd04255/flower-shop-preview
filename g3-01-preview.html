<body><div class="prototype-note">G3-01 LOCAL QA <span>·</span> NOT LIVE</div><main id="qa-root"></main>
<script>
const flowers=[{"slug": "rosy-moment", "name": "로지 모먼트", "english": "ROSE", "description": "사랑을 가장 부드럽게 전하는 방법", "price": 39000, "leadMinutes": 120, "image": "rosy", "color": "핑크 · 로즈", "number": "01", "category": "daily"}, {"slug": "mellow-sunday", "name": "멜로우 선데이", "english": "PEACH", "description": "천천히 흘러가는 오후의 색", "price": 49000, "leadMinutes": 180, "image": "peach", "color": "피치 · 가든 로즈", "number": "02", "category": "daily"}, {"slug": "purple-letter", "name": "퍼플 레터", "english": "SEASONAL", "description": "계절의 인상을 담은 꽃다발", "price": 59000, "leadMinutes": 240, "image": "petals", "color": "라일락 · 퍼플", "number": "03", "category": "daily"}, {"slug": "ivory-day", "name": "아이보리 데이", "english": "IVORY", "description": "담백한 화이트와 그린의 조화", "price": 45000, "leadMinutes": 120, "image": "editorial", "color": "화이트 · 그린", "number": "04", "category": "collection"}, {"slug": "coral-diary", "name": "코랄 다이어리", "english": "CORAL", "description": "포근한 코랄빛으로 전하는 인사", "price": 55000, "leadMinutes": 120, "image": "peach", "color": "코랄 · 소프트 피치", "number": "05", "category": "collection"}];
const number = n => n.toLocaleString('ko-KR')+'원';
const photo=(id,cl='',label='가상 화보')=>`<div class="photo photo--${id} ${cl}" role="img" aria-label="${label}"></div>`;
const card=(p,compact=false)=>`<article class="${compact?'collection-card':'product-card'}"><a class="photo-link" href="#product/${p.slug}" aria-label="${p.name} 상세 보기">${photo(p.image,'',p.name+' 화보')} ${compact?'':`<span class="image-number">${p.number} / ${p.english}</span>`}<span class="photo-arrow" aria-hidden="true">↗</span></a><div class="product-caption"><div><h3>${p.name}</h3><p>${compact?p.color:p.description}</p></div><strong>${number(p.price)}</strong></div></article>`;
const footer =()=>`<footer class="customer-footer"><b>오후의 정원</b><small>FLOWERS, FOR THE MOMENTS WE KEEP.</small><div><span>가상 매장 · 실제 연락처 미설정</span><span>G3-01 LOCAL · NO BOOKING</span></div></footer>`;
const home =()=>`<section class="hero-photo" aria-label="오후의 정원 소개">${photo('hero','hero-bg','햇살 속 꽃다발 화보')}<div class="hero-shade"></div><header class="hero-nav"><a class="brand" href="#home"><span>AFTERNOON</span><strong>오후의 정원</strong><small>FLOWER ATELIER</small></a><a class="hero-menu" href="#curation">FLOWERS <span>↘</span></a></header><div class="hero-text"><p class="hero-micro">FLOWERS FOR THE MOMENTS WE KEEP.</p><h1>마음이 머무는 곳에<br><i>꽃을 놓아요.</i></h1><p class="hero-description">소중한 하루에, 오래도록 기억될 한 다발.</p><a class="hero-cta" href="#curation">오늘의 꽃 만나기 <span>↗</span></a></div><div class="hero-bottom"><span>SCROLL TO DISCOVER</span><span>↓</span><span>EST. 2026</span></div></section>
<section class="manifesto"><p class="overline">A NOTE FROM THE ATELIER <span>01 / 05</span></p><p class="manifesto-copy">어떤 마음은<br>말보다 <em>꽃이</em><br>더 잘 전해주니까.</p><span class="small-dash"></span><p class="manifesto-foot">조금 느리더라도, 정성껏 한 송이씩.<br>우리의 계절을 담아 묶습니다.</p></section>
<section id="curation" class="curation"><div class="section-label"><span>THE DAILY EDIT</span><span>02 / 05</span></div><div class="section-heading"><h2>Today’s<br><i>selection.</i></h2><p>오늘 가장 예쁜 세 가지</p></div><div class="product-collection">${flowers.filter(p=>p.category==='daily').map(p=>card(p)).join('')}</div><p class="section-support">* 사진과 가격은 가상 자료입니다. 오늘의 추천은 최대 3개입니다.</p></section>
<section class="editorial-pause">${photo('editorial','pause-image','따스한 빛 속 꽃의 질감')}<div class="pause-overlay"></div><div class="pause-copy"><span>THE ART OF GIVING</span><h2>꽃을 건네는 순간,<br>평범한 하루가<br><i>조금 특별해져요.</i></h2><p>마음을 담는 가장 작은 의식.</p></div></section>
<section class="arrivals" id="arrivals"><div class="section-label"><span>FROM THE FLOWER MARKET</span><span>03 / 05</span></div><div class="arrivals-title"><h2>Just<br><i>arrived.</i></h2><p>최근 7일간 들어온 꽃 소식<br><b>입고 꽃은 예약 없이 문의만 가능합니다.</b></p></div>${[{date:'11.05',name:'가든 로즈',price:'6,000원 / 송이',photo:'petals'},{date:'11.04',name:'라넌큘러스',price:'5,000원 / 송이',photo:'peach'},{date:'11.03',name:'라일락 튤립',price:'4,500원 / 송이',photo:'foliage'}].map(p=>`<div class="arrival-row">${photo(p.photo,'arrival-photo',p.name+' 가상 사진')}<div class="arrival-content"><span>${p.date} / SAMPLE</span><h3>${p.name}</h3><p>${p.price}</p></div><em>문의 전용</em></div>`).join('')}</section>
<section class="everyday-flowers"><div class="section-label"><span>THE FLOWER COLLECTION</span><span>04 / 05</span></div><div class="section-heading"><h2>Everyday<br><i>flowers.</i></h2><p>오늘의 추천 외에도 만나볼 수 있는<br>꽃다발이 있습니다.</p></div><div class="everyday-grid">${flowers.filter(p=>p.category==='collection').map(p=>card(p,true)).join('')}</div></section>
<section class="pickup-story"><span>YOUR MOMENT, RESERVED.</span><h2>좋아하는 꽃을 고르고<br>원하는 날에<br><i>직접 만나보세요.</i></h2><p>예약 요청 후 매장 확인과 연락을 거쳐 최종 확정됩니다.</p><p class="no-booking">G3-01에서는 상품 열람만 가능합니다. 예약 접수는 연결되지 않았습니다.</p><a href="#product/rosy-moment" class="footer-book">대표 꽃다발 상세 보기 <span>↗</span></a></section>
<section class="visit-us" id="store-info"><div class="section-label"><span>COME SAY HELLO</span><span>05 / 05</span></div><h2>Visit the<br><i>atelier.</i></h2><p>꽃을 직접 건네는 순간까지 정성껏 준비합니다.</p><dl class="visit-details"><div><dt>ADDRESS</dt><dd>가상 매장 — 실제 주소 미등록<small>실매장 등록 시 주소 표시 예정</small></dd></div><div><dt>OPENING HOURS</dt><dd>월–금 11:00–20:00 (예시)<small>실제 영업시간 연결 전</small></dd></div><div><dt>CONTACT</dt><dd>전화 문의 채널 미등록<small>실제 번호 연결 및 발신 미구현</small></dd></div><div><dt>PICKUP</dt><dd>예약 요청 → 매장 확인 → 고객 연락 → 수동 확정<small>입고 꽃은 문의만 가능, 예약 대상 아님</small></dd></div></dl></section>${footer()}`;
const detail=p=>`<header class="simple-nav"><a href="#home" class="nav-back" aria-label="홈으로 돌아가기">←</a><a href="#home" class="simple-name">오후의 정원</a><span class="nav-right">FLOWER ATELIER</span></header><section class="detail-hero">${photo(p.image,'detail-image',p.name+' 가상 화보')}<span>NO. ${p.number} — ${p.category==='daily'?'THE DAILY EDIT':'FLOWER COLLECTION'}</span></section><article class="detail-body"><p class="overline dark">HAND-TIED BOUQUET</p><h1>${p.name}</h1><div class="detail-price"><strong>${number(p.price)}</strong><span>픽업 전용 · 1종 1개</span></div><p class="detail-lead">${p.description}.<br>마음을 담아 정성껏 묶은 한 다발입니다.</p><div class="detail-divider"></div><div class="fact-row"><span>준비시간</span><strong>최소 ${p.leadMinutes}분 (가상 설정)</strong></div><div class="fact-row"><span>예약 가능일</span><strong>오늘부터 14일 이내 (정책)</strong></div><div class="fact-row"><span>픽업 방식</span><strong>매장 직접 수령</strong></div><div class="fact-row"><span>예약 확정</span><strong>매장 연락 후 수동 확정</strong></div><div class="detail-divider"></div><h2>꽃의 이야기</h2><p class="detail-story">오늘 당신이 고른 꽃이, 누군가에게는 한동안 잊히지 않을 하루가 되기를.</p><div class="detail-photo-strip">${photo('petals','','꽃잎 디테일 가상 사진')}${photo('editorial','','꽃다발 디테일 가상 사진')}</div><div class="pending-action" role="status"><strong>예약 요청 기능은 아직 열리지 않았습니다.</strong><span>G3-02 별도 승인 후 연결 예정이며, 지금은 어떤 개인정보도 입력하거나 전송하지 않습니다.</span></div><a href="#home" class="solid-action">꽃다발 더 살펴보기 <span>↗</span></a><small class="small-disclaimer">가상 상품·가격으로 구성한 로컬 검토 화면입니다. 실제 재고·예약·결제는 제공하지 않습니다.</small></article>${footer()}`;
function render() { const hash=decodeURIComponent(location.hash.slice(1)); let contents=home(); if(hash.startsWith('product/')) {let p=flowers.find(p=>p.slug===hash.slice(8)); if(p) contents=detail(p); } document.getElementById('qa-root').innerHTML=contents; if(hash==='curation')document.getElementById('curation')?.scrollIntoView(); else if(hash==='arrivals')document.getElementById('arrivals')?.scrollIntoView(); else scrollTo(0,0); }
addEventListener('hashchange',render);render();
</script></body></html>
