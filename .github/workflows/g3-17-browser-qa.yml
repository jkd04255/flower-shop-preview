name: Flower shop consolidated Chromium + WebKit QA · G3-69
on:
  pull_request:
    paths:
      - index.html
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
      - name: Install browser test dependencies (no app runtime changes)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core axe-core@4.10.3 pngjs@7.0.0
      - name: G3-22 real Chrome compositor scale, text and focus (strict gate)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          G322_DISCOVERY: '0'
        run: node tests/g3-22-scale-text-focus-qa.cjs
      - name: G3-21 Chromium reflow/photo contrast/focus strict gate
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          G321_DISCOVERY: '0'
        run: node tests/g3-21-visual-zoom-qa.cjs
      - name: G3-20 axe-core WCAG 2.1 AA (strict zero-violation gate)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          AXE_ENFORCE: '1'
        run: node tests/g3-20-axe-qa.cjs
      - name: Prior synthetic regression
        run: |
          node tests/g3-12-synthetic-qa.cjs
          node tests/g3-13-integrated-qa.cjs
          node tests/g3-14-form-a11y-qa.cjs
      - name: G3-15 real Chrome end-to-end
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-15-browser-qa.cjs
      - name: G3-16 real Chrome two-tab regression
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-16-browser-qa.cjs
      - name: G3-17 real Chrome focus/filter/reset regression
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-17-browser-qa.cjs
      - name: G3-18 real Chrome admin reset and calendar refresh announcements
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-18-browser-qa.cjs
      - name: G3-19 real Chrome mobile readability and empty calendar
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-19-browser-qa.cjs
      - name: G3-24 mandatory final review and booking privacy
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-24-reservation-review-qa.cjs
      - name: G3-25 homepage product card discoverability and axe accessibility
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-25-product-discovery-qa.cjs
      - name: G3-26 booking progress indicator and review flow
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-26-booking-progress-qa.cjs
      - name: G3-27 product detail heading focus and visible keyboard controls
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-27-detail-focus-qa.cjs
      - name: G3-28 mobile touch focus and zoom stabilization
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-28-mobile-touch-zoom-qa.cjs
      - name: Install only WebKit runtime OS libraries (non-iOS approximation)
        timeout-minutes: 8
        run: |
          # The hosted Azure package mirror can stall while downloading WebKit libraries.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libgtk-4-1 libgraphene-1.0-0 libevent-2.1-7t64 libopus0 \
            libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 \
            libgstreamer-plugins-bad1.0-0 libavif16 libharfbuzz-icu0 \
            libwayland-server0 libmanette-0.2-0 libsecret-1-0 \
            libhyphen0 libgles2 gstreamer1.0-libav
      - name: Install Playwright WebKit browser (non-iOS approximation)
        timeout-minutes: 5
        run: npx playwright-core install webkit
      - name: G3-29 WebKit mobile touch/zoom and keyboard booking regression
        run: node tests/g3-29-webkit-mobile-qa.cjs
      - name: G3-69 owner studio real customer preview, uploads and draft isolation · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-69-owner-studio-qa.cjs
      - name: G3-42 Safari early swipe and idle hero peek · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-42-safari-early-scroll-qa.cjs
      - name: G3-30 Chromium and WebKit pickup preview and admin calendar shortcut
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-30-pickup-admin-ux-qa.cjs
      - name: G3-31 Chromium and WebKit weekday preview + admin filter UX + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-31-weekday-filter-qa.cjs
      - name: G3-32 review details and admin next-action · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-32-review-admin-ux-qa.cjs
      - name: G3-33 memo length and admin synthetic capacity · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-33-memo-slot-qa.cjs
      - name: G3-34 direct pickup date and admin sorting · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-34-quick-date-admin-sort-qa.cjs
      - name: G3-35 direct pickup hour + reverse sort · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-35-earliest-time-admin-reverse-qa.cjs
      - name: G3-36 direct pickup hours and admin ID-only search · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-36-latest-time-admin-id-search-qa.cjs
      - name: G3-37 date changes, admin search clear and customer status lookup · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-37-next-date-search-clear-qa.cjs
      - name: G3-38 dedicated customer booking status · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-38-customer-status-page-qa.cjs
      - name: G3-39 mobile booking legibility + clear/relookup · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-39-status-mobile-relookup-qa.cjs
      - name: G3-40 customer pickup summary and local status refresh · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-40-pickup-summary-refresh-qa.cjs
      - name: G3-41 home hero on reload and retained anchors · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-41-home-reload-scroll-qa.cjs
      - name: G3-43 Korean-first typography, 320/390/1280px reflow · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-43-typography-hierarchy-qa.cjs
      - name: G3-44 photo ratios, source preservation and lookup preview · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-44-photo-presentation-qa.cjs
      - name: G3-45 mobile nav, route links, focus and 320/390/700 reflow · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-45-mobile-navigation-qa.cjs
      - name: G3-46 understated mobile navigation design · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-46-editorial-mobile-nav-qa.cjs
      - name: G3-47 concise reservation and booking-status UX · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-47-reservation-status-clarity-qa.cjs
      - name: G3-49 removed pickup shortcuts and direct date/time flow · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-48-simplified-pickup-qa.cjs
      - name: G3-50 full-width mobile form and 16px controls · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-50-mobile-form-readability-qa.cjs
      - name: G3-51 mobile review layout, editable details and final confirm · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-51-mobile-review-hierarchy-qa.cjs
      - name: G3-52 clear booking-result CTA and secondary navigation · Chromium + WebKit
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-52-mobile-result-priority-qa.cjs
      - name: G3-53 mobile status lookup form hierarchy and sample relookup · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-53-mobile-status-lookup-qa.cjs
      - name: G3-54 mobile result card hierarchy and intact synthetic status · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-54-mobile-status-card-qa.cjs
      - name: G3-55 swipeable admin status filter rail · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-55-mobile-admin-filter-qa.cjs
      - name: G3-56 mobile admin search and sort hierarchy · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-56-mobile-admin-search-sort-qa.cjs
      - name: G3-57 mobile admin booking cards, selection and metadata · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-57-mobile-admin-request-cards-qa.cjs
      - name: G3-58 mobile admin detail pickup and controls · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-58-mobile-admin-detail-qa.cjs
      - name: G3-59 mobile calendar status filter rail · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-59-mobile-calendar-status-filters-qa.cjs
      - name: G3-60 mobile calendar metrics layout and counts · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-60-mobile-calendar-metrics-qa.cjs
      - name: G3-61 mobile calendar day navigation touch targets · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-61-mobile-calendar-day-controls-qa.cjs
      - name: G3-62 mobile calendar timeline summaries · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-62-mobile-calendar-timeline-summary-qa.cjs
      - name: G3-63 mobile timeline expanded card actions · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-63-mobile-calendar-timeline-actions-qa.cjs
      - name: G3-64 mobile current booking step · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-64-mobile-booking-current-step-qa.cjs
      - name: G3-65 mobile customer relookup action · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-65-mobile-status-relookup-action-qa.cjs
      - name: G3-66 mobile store booking lookup form · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-66-mobile-store-lookup-form-qa.cjs
      - name: G3-67 mobile store information table · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-67-mobile-store-facts-qa.cjs
      - name: G3-68 mobile booking progress legibility · Chromium + WebKit + axe
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/g3-68-mobile-booking-progress-legibility-qa.cjs
      - name: Screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-22-scale-focus-axe-evidence
          path: qa-artifacts/
          if-no-files-found: ignore
